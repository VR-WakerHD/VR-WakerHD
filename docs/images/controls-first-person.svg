<text x="28" y="538.0" font-size="15" fill="#1f2933" text-anchor="start">Pause menu (+)</text>
<polyline points="790,250 938,110.0" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
<circle cx="790" cy="250" r="4" fill="#0b6e99"/>
<text x="1172" y="104.0" font-size="15" font-weight="700" fill="#0b6e99" text-anchor="end">Trigger</text>
<text x="1172" y="124.0" font-size="15" fill="#1f2933" text-anchor="end">Empty hands: item wheel. Aimed</text>
<text x="1172" y="142.0" font-size="15" fill="#1f2933" text-anchor="end">items: fire</text>
<polyline points="771,296 938,179.0" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
<circle cx="771" cy="296" r="4" fill="#0b6e99"/>
