<text x="410" y="520" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle">Left: shield hand</text>
<text x="790" y="520" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle">Right: sword hand</text>
