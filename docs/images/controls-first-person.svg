<circle cx="368" cy="320" r="4" fill="#0b6e99"/>
<text x="28" y="311.0" font-size="15" font-weight="700" fill="#0b6e99" text-anchor="start">Stick click</text>
<text x="28" y="331.0" font-size="15" fill="#1f2933" text-anchor="start">VR settings menu</text>
