<text x="1172" y="262.0" font-size="15" fill="#1f2933" text-anchor="end">Turn (smooth or snap)</text>
<polyline points="832,320 938,317.0" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
<circle cx="832" cy="320" r="4" fill="#0b6e99"/>
<text x="1172" y="311.0" font-size="15" font-weight="700" fill="#0b6e99" text-anchor="end">Stick click</text>
<text x="1172" y="331.0" font-size="15" fill="#1f2933" text-anchor="end">First / third person</text>
<polyline points="765,336 938,386.0" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
<circle cx="765" cy="336" r="4" fill="#0b6e99"/>
<text x="1172" y="380.0" font-size="15" font-weight="700" fill="#0b6e99" text-anchor="end">A</text>
<text x="1172" y="400.0" font-size="15" fill="#1f2933" text-anchor="end">Talk, open, climb, sidle; parry when</text>
<text x="1172" y="418.0" font-size="15" fill="#1f2933" text-anchor="end">prompted</text>
<polyline points="828,340 938,455.0" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
<circle cx="828" cy="340" r="4" fill="#0b6e99"/>
<text x="1172" y="449.0" font-size="15" font-weight="700" fill="#0b6e99" text-anchor="end">Stick down (hold)</text>
<text x="1172" y="469.0" font-size="15" fill="#1f2933" text-anchor="end">Crouch / shield (ZR)</text>
<polyline points="850,346 938,524.0" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
<circle cx="850" cy="346" r="4" fill="#0b6e99"/>
<text x="1172" y="518.0" font-size="15" font-weight="700" fill="#0b6e99" text-anchor="end">Grip</text>
<text x="1172" y="538.0" font-size="15" fill="#1f2933" text-anchor="end">Item on R. Over the shoulder: draw</text>
<text x="1172" y="556.0" font-size="15" fill="#1f2933" text-anchor="end">the sword</text>
<text x="600.0" y="638" font-size="15" fill="#52606d" text-anchor="middle">Hold both stick clicks 0.6 s to recentre. Left-handed (vr.leftHanded=1) swaps the hands.</text>
<text x="600.0" y="660" font-size="15" fill="#52606d" text-anchor="middle">Defaults; rebind in the VR launcher's Controllers tab.</text>
</svg>
