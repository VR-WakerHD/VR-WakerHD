<text x="28" y="487.0" font-size="15" fill="#1f2933" text-anchor="start">shoulder: item wheel</text>
<polyline points="397,381 262,524.0" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
<circle cx="397" cy="381" r="4" fill="#0b6e99"/>
